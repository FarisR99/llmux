# profiles.example.yaml — template. Copy to `profiles.yaml` and edit.
#
# `profiles.yaml` is the single source of truth for model profiles across both
# backends. At launch time llmux renders each profile into
# `.runtime/<backend>/<name>.env` and passes it to `docker compose --env-file`.
#
# Schema minimum = `name` + `backend`; anything omitted inherits from
# `defaults.<backend>`. To actually start a profile, vLLM needs either
# `model_id` or config/<name>.yaml with `model`, and llama.cpp needs GGUF
# metadata (`model_file`, `hf_repo`, `hf_file`) plus a config with `model-file`
# or the profile-level `model_file` fallback.

version: 1

defaults:
  vllm:
    port: 8000
    gpu_id: "0"
    tensor_parallel_size: 1
    enable_lora: false
  llamacpp:
    port: 8080
    gpu_id: "0"
    # Host-only local asset catalog; no files are moved or downloaded.
    # library_roots:
    #   - /srv/llama-cpp

profiles:
  # ── vllm example ────────────────────────────────────────────
  - name: qwen3-0-6b
    backend: vllm
    container_name: qwen3-0-6b
    port: 8000
    config_name: qwen3-0-6b       # → config/vllm/qwen3-0-6b.yaml
    model_id: Qwen/Qwen3-0.6B     # used by auto-config on first launch
    gpu_id: "0"
    # enable_lora: true
    # max_loras: 2
    # max_lora_rank: 16
    # lora_modules: adapter1=/app/lora/path1,adapter2=/app/lora/path2
    # extra_pip_packages: flash-attn==2.7.4.post1
    # env_vars:
    #   VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: "1"

  # ── llamacpp example ────────────────────────────────────────
  - name: gemma-3-4b
    backend: llamacpp
    container_name: gemma-3-4b
    port: 8080
    config_name: gemma-3-4b       # → config/llamacpp/gemma-3-4b.yaml
    gpu_id: "0"
    model_file: gemma-3-4b-it-q4_k_m.gguf  # used for download and as config fallback
    hf_repo: unsloth/gemma-3-4b-it-GGUF
    hf_file: gemma-3-4b-it-q4_k_m.gguf

  # Host llama.cpp (Linux). Uncomment and set paths to use your own build.
  # Docker is the default when runtime is omitted; vLLM is Docker-only.
  # - name: custom-host
  #   backend: llamacpp
  #   runtime: host
  #   server_binary: /usr/local/bin/llama-server
  #   model_path: /srv/models/model.gguf
  #   port: 8081
  #   config_name: custom-host
  #   gpu_id: "0"
  #   env_vars:
  #     LD_LIBRARY_PATH: /opt/custom-llama/lib
  # For HF downloads, replace model_path with hf_repo and hf_file.
  # defaults.llamacpp may also set runtime and server_binary.
  # Docker local model directory (instead of hf_repo/hf_file): mounted /models:ro.
  #   model_volume: /srv/models
  #   model_file: my-model.gguf
  # Optional explicit local companion assets for multimodal/speculative models:
  #   mmproj_path: /srv/llama-cpp/mmproj/model.gguf
  #   draft_model_path: /srv/llama-cpp/mtp/model.gguf
  #   draft_type: draft-mtp
  #   # Embedded MTP needs no draft_model_path; optional MTP-n limit:
  #   # mtp_n: 3
  #   chat_template_path: /srv/llama-cpp/chat-templates/qwen3.jinja
